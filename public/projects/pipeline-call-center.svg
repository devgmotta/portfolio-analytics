<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura conceitual: Pipeline de Dados — Simulação Call Center</title>
  <desc id="desc">Diagrama simplificado: eventos de atendimento simulados são ingeridos no BigQuery, modelados em camadas com dbt e consumidos por um dashboard de SLA no Power BI.</desc>
  <rect width="640" height="360" fill="#09090b" />
  <g fill="none" stroke="#27272a" stroke-width="1">
    <path d="M0 60H640M0 120H640M0 180H640M0 240H640M0 300H640" />
    <path d="M80 0V360M240 0V360M400 0V360M560 0V360" />
  </g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa">
    <g stroke="#10b981" stroke-width="1.5" fill="none">
      <rect x="30" y="150" width="130" height="60" rx="8" />
    </g>
    <text x="95" y="176" text-anchor="middle" fill="#f4f4f5">Eventos</text>
    <text x="95" y="192" text-anchor="middle">Call Center (sim.)</text>

    <g stroke="#f97316" stroke-width="1.5" fill="none">
      <rect x="255" y="130" width="130" height="100" rx="8" />
    </g>
    <text x="320" y="168" text-anchor="middle" fill="#f4f4f5">BigQuery</text>
    <text x="320" y="188" text-anchor="middle">+ dbt</text>
    <text x="320" y="206" text-anchor="middle">staging → marts</text>

    <g stroke="#10b981" stroke-width="1.5" fill="none">
      <rect x="480" y="150" width="130" height="60" rx="8" />
    </g>
    <text x="545" y="176" text-anchor="middle" fill="#f4f4f5">Power BI</text>
    <text x="545" y="192" text-anchor="middle">SLA dashboard</text>

    <path d="M160 180H255" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow3)" />
    <path d="M385 180H480" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow3)" />
  </g>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#f97316" opacity="0.8">
    <text x="320" y="270" text-anchor="middle">[ EM ANDAMENTO ]</text>
  </g>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#3f3f46" />
    </marker>
  </defs>
</svg>
